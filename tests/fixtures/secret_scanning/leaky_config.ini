; The negative control for the secret scan. This file MUST be detected.
;
; CI scans this directory on its own and fails the build unless the key is found. That is what
; proves the scanning check can fail at all: a check never observed failing is not known to work.
;
; It does not prove the exemptions in /.gitleaks.toml are narrow — this directory is scanned where
; that file is not consulted. Exemption breadth is guarded by
; tests/structure/test_secret_scanning_config.py instead.
;
; The key below is synthetic and has never existed. It is NOT a credential.
;
; It may not be edited casually. The detection rule matches a fixed prefix followed by sixteen
; characters from the base32 alphabet — A-Z and 2-7 — so a plausible-looking key containing 0, 1, 8
; or 9 is not matched at all. A key like that would leave this control passing by finding nothing,
; while claiming to prove the opposite. That mistake was made once during planning and is recorded
; as R7 in specs/004-ci-scanning-packaging/research.md.
;
; If you change it, run the negative control and watch it fail before trusting it:
;   see specs/004-ci-scanning-packaging/quickstart.md, "The negative control".

[default]
aws_access_key_id = AKIAQ7B4TYZ3KJ6MNP5R
