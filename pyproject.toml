[project]
name = "hermes-memory"
version = "0.1.0"
description = "Engineering memory: private conversation history, retained and recallable."
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "structlog>=26.1.0",
    "typer>=0.12",
]

[project.scripts]
# The container image's entry point. It is the installed console script rather than a path into
# src/, so that the image exercises the packaged application — see
# specs/004-ci-scanning-packaging/research.md R11.
hermes-memory = "hermes_memory.cli:main"

# Each dependency arrives with the feature that needs it — the stack table fixes which tool is
# used when one is needed, not that all of them are pinned on day one.
#
# pydantic, pydantic-settings  the Models and contracts row. `pydantic-settings` is the part of
#                              Pydantic v2 carrying BaseSettings, separated at the v1→v2 split for
#                              packaging reasons, and it displaces nothing
#                              (specs/002-environment-configuration/research.md R2).
# structlog                    the Logging row.
# opentelemetry-api, -sdk      the Telemetry row: the API for callers, the SDK for the process
#                              that configures a provider. No exporter is declared — nothing is
#                              exported yet (specs/003-logging-telemetry-baseline/research.md R11).
# typer                        the CLI row, added by 004-ci-scanning-packaging. The entry point it
#                              provides is a shell with no command: the container image's entry
#                              point has to be an installed application, and commands arrive with
#                              the features that specify them.
# tests/structure/test_packaging.py holds this line.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    # Only so that tests/structure/test_ci_workflow.py can parse the workflow instead of
    # pattern-matching its text. Development-only; FR-011 concerns runtime dependencies.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_memory"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
