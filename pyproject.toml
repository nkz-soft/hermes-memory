[project]
name = "hermes-memory"
version = "0.1.0"
description = "Engineering memory: private conversation history, retained and recallable."
readme = "README.md"
license = "MIT"
requires-python = "==3.13.*"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
]

# Each dependency arrives with the feature that needs it — the stack table fixes which tool is
# used when one is needed, not that all of them are pinned on day one. These two are the Pydantic
# v2 entry the constitution already fixes; `pydantic-settings` is the part of it carrying
# BaseSettings, separated at the v1→v2 split for packaging reasons, and it displaces nothing
# (specs/002-environment-configuration/research.md R2).
# tests/structure/test_packaging.py holds this line.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    # Only so that tests/structure/test_ci_workflow.py can parse the workflow instead of
    # pattern-matching its text. Development-only; FR-011 concerns runtime dependencies.
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_memory"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
