name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The checks only read the repository. Say so, rather than inheriting the default token
# scope — and note that nothing here reads a secret, which is what lets this workflow run
# unchanged on a pull request from a fork. The scanning and image jobs were added under that same
# constraint: no secret, no registry login, nothing pushed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are wasted work. Pushes to main are not: cancelling one leaves
  # a commit on the default branch with no recorded result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        # Reads .python-version, the same pin a contributor's uv reads, so that a local pass and
        # a CI pass mean the same thing.
        run: uv python install

      - name: Install the environment
        # --locked fails when uv.lock disagrees with pyproject.toml instead of quietly
        # re-resolving. That failure is the point of the flag.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Not the default, and load-bearing. actions/checkout fetches a single commit unless
          # told otherwise, and a history scan over one commit passes without looking at anything.
          fetch-depth: 0

      - name: Scan the history (C5)
        # The scanner is pinned to an exact version: a floating tag would make this job's verdict a
        # function of an upstream release rather than of the change under test.
        #
        # `-v` so a finding names its file, line and rule; `--redact` so the matched value is never
        # printed into a build log that is public on a public repository.
        #
        # The GIT_CONFIG_* trio exempts the bind-mounted repository from git's ownership check.
        # Without it git refuses to read a repository owned by another uid, and the scanner reports
        # zero findings on a repository it never opened — a silent false pass.
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git . --no-banner --redact -v

      - name: Prove the scan can fail
        # The negative control. tests/fixtures/secret_scanning/ carries a synthetic key that must be
        # detected, and this step fails the job unless it is. It proves that the scanner and this
        # invocation of it can produce a failure at all — a check never observed failing is not
        # known to work. It says nothing about whether the exemptions are too broad; that is
        # guarded separately, by the shape assertions in
        # tests/structure/test_secret_scanning_config.py.
        #
        # The directory is scanned directly, where /.gitleaks.toml is not consulted, so the
        # fixture's own exemption cannot mask it.
        #
        # --exit-code 42 is what makes this honest. The scanner exits 1 both when it finds a leak
        # and when it fails fatally — a renamed fixture, a mistyped flag, an image that would not
        # pull — so "non-zero" would let a scan that never ran stand in for a scan that worked. 42
        # is returned only for a finding.
        run: |
          set +e
          docker run --rm \
            -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 dir tests/fixtures/secret_scanning \
            --no-banner --redact -v --exit-code 42
          status=$?
          set -e
          if [ "$status" -ne 42 ]; then
            echo "::error::The negative control reported no finding (exit $status). Either the scan"
            echo "::error::is not working or it did not run at all, whatever the previous step"
            echo "::error::reported. See specs/004-ci-scanning-packaging."
            exit 1
          fi

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image (C6)
        # Nothing is pushed and no registry is logged into: publishing needs credentials, and a job
        # that needs a secret stops running on pull requests from forks.
        run: docker build -t hermes-memory:ci .

      - name: Run the image (C7)
        # Both halves are asserted, and separately. The container must exit 0 *and* print usage:
        # an entry point that exits 0 having printed nothing would satisfy a status check while
        # failing the thing this check exists for, and one that prints usage and then exits 2
        # would satisfy an output check while breaking FR-014.
        #
        # They are two statements rather than a pipeline on purpose. A `run:` block's default shell
        # is `bash -e` without pipefail, so in `docker run | grep -q` only grep's status would
        # reach the step and a non-zero container exit would pass unnoticed.
        #
        # No arguments are passed: `--help` is the image's default argument, so this is exactly the
        # acceptance criterion of issue #7 — an image whose entry point runs the CLI's --help.
        run: |
          docker run --rm hermes-memory:ci > usage.txt
          grep -q "Usage:" usage.txt

      - name: Confirm what the image does not carry
        # The image must not ship the development dependencies, the tests, or anything from the
        # ignored data directory, and must not run as root.
        run: |
          docker run --rm --entrypoint sh hermes-memory:ci -c '
            test ! -d /app/tests || { echo "tests/ shipped in the image"; exit 1; }
            test ! -e /app/data || { echo "data/ shipped in the image"; exit 1; }
            if python -c "import pytest" 2>/dev/null; then
              echo "pytest shipped in the image"; exit 1
            fi
            test "$(id -u)" -ne 0 || { echo "the container runs as root"; exit 1; }
          '
